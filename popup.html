<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Element Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup">
    <h1>Element Agent</h1>

    <label for="promptInput">Yêu cầu</label>
    <textarea id="promptInput" placeholder="Mô tả mục tiêu theo ngôn ngữ tự nhiên. AI sẽ tự quyết định cần một hay nhiều bước..."></textarea>

    <div class="button-group">
      <button id="analyzeLayoutButton">Chống Fullscreen</button>
      <button id="antiPauseButton">Chống Tự Dừng</button>
    </div>
    
    <div class="button-group run-group">
      <button id="runAiButton">Thực thi AI</button>
    </div>

    <div class="debug-actions">
      <button id="btnShowReq">Request</button>
      <button id="btnShowRes">Response</button>
    </div>

    <pre id="analysisResult">Dữ liệu sẽ hiển thị tại đây...</pre>
    <p id="status">Sẵn sàng.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
